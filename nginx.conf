server {
    listen 80;

    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # O index.html não pode ficar em cache: é ele que aponta para o bundle com
    # hash no nome, e o deploy apaga o bundle anterior. Quem volta com o HTML
    # velho pede um arquivo que não existe mais e vê tela branca — sem erro na
    # tela, sem aviso, sem como adivinhar que bastava recarregar.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Estes sim podem ficar para sempre: o hash no nome muda a cada build, então
    # um arquivo nunca muda de conteúdo sem mudar de endereço.
    location /static/ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control public;
    }

    error_page 404 /index.html;
}
